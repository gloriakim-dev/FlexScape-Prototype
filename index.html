<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pose Matcher: Hole in the Wall</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --text: #f8fafc;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 1.8rem;
    }

    .container {
      position: relative;
      width: 640px;
      height: 480px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      background: var(--card-bg);
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
      transform: scaleX(-1); /* Mirror camera for natural movement */
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.75);
      padding: 10px 20px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    .progress-bar-container {
      width: 100%;
      height: 16px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--success);
      transition: width 0.1s linear;
    }

    .status-badge {
      align-self: center;
      font-size: 1.5rem;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.8);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      transition: transform 0.1s ease;
    }

    #start-btn:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }
  </style>

  <!-- Load MediaPipe Tasks Vision -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0"></script>
</head>
<body>

  <h1>Hole in the Wall: Pose Matcher</h1>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-overlay">
      <div class="hud-header">
        <span id="stage-text">Stage: 1/3</span>
        <span id="target-name">Target: T-Pose</span>
      </div>
      
      <div class="status-badge" id="status-text">Get Ready</div>

      <div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="hold-progress"></div>
        </div>
      </div>
    </div>

    <button id="start-btn">Start Game</button>
  </div>

  <script type="module">
    import {
      PoseLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output_canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("start-btn");
    const stageText = document.getElementById("stage-text");
    const targetNameText = document.getElementById("target-name");
    const statusText = document.getElementById("status-text");
    const progressBar = document.getElementById("hold-progress");

    let poseLandmarker;
    let runningMode = "VIDEO";
    let lastVideoTime = -1;
    let currentPose = null;

    // Game state setup
    const HOLD_DURATION_MS = 3000;
    let currentStageIndex = 0;
    let holdStartTime = null;
    let isGameActive = false;

    // Define target poses with geometric checking rules
    const POSES = [
      {
        name: "T-Pose",
        check: (landmarks) => {
          const lShoulder = landmarks[11], rShoulder = landmarks[12];
          const lElbow = landmarks[13], rElbow = landmarks[14];
          const lWrist = landmarks[15], rWrist = landmarks[16];

          // Check if arms are raised horizontally (wrists aligned near shoulders vertically)
          const lArmHorizontal = Math.abs(lWrist.y - lShoulder.y) < 0.15;
          const rArmHorizontal = Math.abs(rWrist.y - rShoulder.y) < 0.15;
          // Check extension outwards
          const lExtended = lWrist.x < lShoulder.x;
          const rExtended = rWrist.x > rShoulder.x;

          return lArmHorizontal && rArmHorizontal && lExtended && rExtended;
        }
      },
      {
        name: "Hands Up",
        check: (landmarks) => {
          const lShoulder = landmarks[11], rShoulder = landmarks[12];
          const lWrist = landmarks[15], rWrist = landmarks[16];

          // Both wrists well above shoulders
          return lWrist.y < (lShoulder.y - 0.2) && rWrist.y < (rShoulder.y - 0.2);
        }
      },
      {
        name: "Right Arm Up",
        check: (landmarks) => {
          const lShoulder = landmarks[11], rShoulder = landmarks[12];
          const lWrist = landmarks[15], rWrist = landmarks[16];

          // Right wrist above shoulder, left wrist below shoulder
          const rUp = rWrist.y < (rShoulder.y - 0.2);
          const lDown = lWrist.y > lShoulder.y;

          return rUp && lDown;
        }
      }
    ];

    // Initialize MediaPipe PoseLandmarker
    async function initPoseLandmarker() {
      statusText.innerText = "Loading Model...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task`,
          delegate: "GPU"
        },
        runningMode: runningMode,
        numPoses: 1
      });
      statusText.innerText = "Ready";
    }

    initPoseLandmarker();

    // Start webcam stream
    startBtn.addEventListener("click", async () => {
      if (!poseLandmarker) return;

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480 }
      });
      video.srcObject = stream;
      
      video.addEventListener("loadeddata", () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        startBtn.style.display = "none";
        isGameActive = true;
        resetGame();
        renderLoop();
      });
    });

    function resetGame() {
      currentStageIndex = 0;
      holdStartTime = null;
      updateUI();
    }

    function updateUI() {
      stageText.innerText = `Stage: ${currentStageIndex + 1}/${POSES.length}`;
      targetNameText.innerText = `Target: ${POSES[currentStageIndex].name}`;
    }

    function renderLoop() {
      // Process video frame
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = poseLandmarker.detectForVideo(video, performance.now());
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.landmarks && results.landmarks.length > 0) {
          const landmarks = results.landmarks[0];
          currentPose = landmarks;

          // Draw pose skeleton overlay
          const drawingUtils = new DrawingUtils(ctx);
          drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, {
            color: "#38bdf8",
            lineWidth: 3
          });
          drawingUtils.drawLandmarks(landmarks, {
            color: "#22c55e",
            radius: 4
          });
        } else {
          currentPose = null;
        }
      }

      // Game Logic Processing
      if (isGameActive && currentStageIndex < POSES.length) {
        const targetPose = POSES[currentStageIndex];
        const isMatching = currentPose ? targetPose.check(currentPose) : false;

        if (isMatching) {
          if (!holdStartTime) holdStartTime = performance.now();
          
          const elapsed = performance.now() - holdStartTime;
          const progressRatio = Math.min(elapsed / HOLD_DURATION_MS, 1);
          
          progressBar.style.width = `${progressRatio * 100}%`;
          statusText.innerText = "HOLD POSE!";
          statusText.style.color = "#22c55e";

          if (elapsed >= HOLD_DURATION_MS) {
            // Stage Completed
            currentStageIndex++;
            holdStartTime = null;
            progressBar.style.width = "0%";

            if (currentStageIndex >= POSES.length) {
              isGameActive = false;
              statusText.innerText = "YOU WIN!";
              statusText.style.color = "#38bdf8";
            } else {
              updateUI();
            }
          }
        } else {
          // Reset progress if pose is broken
          holdStartTime = null;
          progressBar.style.width = "0%";
          statusText.innerText = "MATCH THE POSE";
          statusText.style.color = "#f8fafc";
        }
      }

      requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>
